<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qyrex · Demo</title>
    <meta name="description" content="Demo interativa do Qyrex, a central de trabalho desktop de Pedro Queiroz. Dados fictícios." />
    <link rel="icon" href="./favicon.svg" />
    <style>
      .demo-badge { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; border-radius: 999px; background: rgba(11, 11, 13, .88); color: #e9eaf0; font: 12px/1.2 "Inter Variable", "Segoe UI", sans-serif; box-shadow: 0 12px 30px -12px #000, 0 0 0 1px rgba(255, 255, 255, .08); backdrop-filter: blur(10px); white-space: nowrap; }
      .demo-badge b { color: #fff; }
      .demo-badge span:not(.demo-dot) { color: #a3a8b8; }
      .demo-dot { width: 7px; height: 7px; border-radius: 50%; background: #8b93ff; box-shadow: 0 0 0 0 rgba(139, 147, 255, .7); animation: demo-ping 2s infinite; }
      @keyframes demo-ping { 70% { box-shadow: 0 0 0 8px rgba(139, 147, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 147, 255, 0); } }
      .demo-badge button { border: 0; border-radius: 999px; padding: 6px 12px; background: #8b93ff; color: #0b0b0d; font: inherit; font-weight: 700; cursor: pointer; }
      .demo-badge button:hover { background: #aab0ff; }
      @media (max-width: 1280px) { .demo-badge span:not(.demo-dot) { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
